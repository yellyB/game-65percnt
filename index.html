<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>사랑을 측정합니다</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game">
  <div id="bg"></div>
  <div id="relationship-gauge"><div id="gauge-fill"></div></div>
  <div id="gauge-label">보통</div>
  <div id="scene-desc"><div id="scene-desc-text"></div></div>
  <div id="scene-cg"></div>
  <div id="puzzle-container"></div>
  <div id="dialogue-box">
    <div id="dialogue-top">
      <div id="portrait"></div>
      <div id="speaker"></div>
    </div>
    <div id="text-area"></div>
    <div id="continue-indicator">클릭하여 계속 ▼</div>
  </div>
  <div id="choices"></div>
  <div id="fade"></div>
  <div id="flash"></div>
  <div id="title-screen">
    <h1>사랑을 측정합니다</h1>
    <div class="subtitle">당신의 사랑은 몇 %입니까?</div>
    <div class="start-text">화면을 터치하여 시작</div>
  </div>
</div>
<script src="engine.js"></script>
<script src="explore.js"></script>
<script src="puzzles.js"></script>
<script src="scenes.js"></script>
</body>
</html>
