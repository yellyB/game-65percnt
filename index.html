<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>커플 궁합 테스트</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

body {
  font-family: 'Noto Sans KR', sans-serif;
  background: #000;
  overflow: hidden;
  width: 100vw;
  height: 100dvh;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

#game {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
}

/* ─── Background ─── */
#bg {
  position: absolute;
  inset: 0;
  transition: background 1.5s ease;
  background: #1a1a2e;
  z-index: 0;
}

/* ─── Scene Description ─── */
#scene-desc {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 35%;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1;
  padding: 2rem;
  opacity: 0;
  transition: opacity 0.8s ease;
  pointer-events: none;
}
#scene-desc.visible { opacity: 1; }
#scene-desc-text {
  color: rgba(255,255,255,0.6);
  font-size: 1.1rem;
  font-weight: 300;
  text-align: center;
  letter-spacing: 0.05em;
  line-height: 1.8;
  text-shadow: 0 0 20px rgba(0,0,0,0.5);
}

/* ─── Dialogue Box ─── */
#dialogue-box {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 35%;
  min-height: 180px;
  background: linear-gradient(to bottom, rgba(0,0,0,0.85), rgba(0,0,0,0.95));
  border-top: 1px solid rgba(255,255,255,0.1);
  z-index: 10;
  display: flex;
  flex-direction: column;
  padding: 0;
  cursor: pointer;
  transition: transform 0.6s ease;
}
#dialogue-box.slide-down { transform: translateY(100%); }
#speaker {
  font-size: 0.85rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  min-height: 1.8rem;
}
#speaker.narrator { color: rgba(255,255,255,0.4); font-style: italic; font-weight: 300; }
#speaker.system { color: #40e0d0; }
#speaker.heroine { color: #ff8fa3; }
#speaker.hero { color: #74b9ff; }
#text-area {
  flex: 1;
  padding: 0.5rem 1.5rem;
  font-size: 1rem;
  line-height: 1.8;
  color: rgba(255,255,255,0.9);
  overflow-y: auto;
}
#continue-indicator {
  padding: 0.5rem 1.5rem;
  text-align: right;
  font-size: 0.75rem;
  color: rgba(255,255,255,0.3);
  animation: blink 1.2s ease-in-out infinite;
}
@keyframes blink {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}

/* ─── Choices ─── */
#choices {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.8);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  z-index: 20;
  padding: 2rem;
}
#choices.active { display: flex; }
.choice-btn {
  width: 100%; max-width: 500px;
  padding: 1rem 1.5rem;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 8px;
  color: rgba(255,255,255,0.9);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.95rem;
  line-height: 1.5;
  cursor: pointer;
  transition: all 0.3s ease;
  text-align: left;
}
.choice-btn:hover, .choice-btn:active {
  background: rgba(255,255,255,0.15);
  border-color: rgba(255,255,255,0.5);
  transform: translateX(5px);
}

/* ─── Fade / Flash / Shake ─── */
#fade {
  position: absolute; inset: 0;
  background: #000; z-index: 50;
  opacity: 1; transition: opacity 1s ease;
  pointer-events: none;
}
#fade.hidden { opacity: 0; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  10% { transform: translateX(-8px) translateY(3px); }
  20% { transform: translateX(8px) translateY(-3px); }
  30% { transform: translateX(-6px) translateY(2px); }
  40% { transform: translateX(6px) translateY(-2px); }
  50% { transform: translateX(-4px); }
  60% { transform: translateX(4px); }
}
.shake { animation: shake 0.6s ease-in-out; }
@keyframes flash { 0% { opacity: 0; } 10% { opacity: 0.8; } 100% { opacity: 0; } }
#flash {
  position: absolute; inset: 0;
  background: #fff; z-index: 40;
  opacity: 0; pointer-events: none;
}
#flash.active { animation: flash 0.5s ease-out; }

/* ─── Title Screen ─── */
#title-screen {
  position: absolute; inset: 0;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
  cursor: pointer;
}
#title-screen h1 {
  font-size: 2rem; font-weight: 700; color: #fff;
  text-align: center; margin-bottom: 0.5rem; letter-spacing: 0.1em;
}
#title-screen .subtitle { font-size: 0.9rem; color: rgba(255,255,255,0.5); margin-bottom: 3rem; }
#title-screen .start-text { font-size: 0.85rem; color: rgba(255,255,255,0.4); animation: blink 1.5s ease-in-out infinite; }

/* ─── Puzzle Container ─── */
#puzzle-container {
  position: absolute; inset: 0;
  z-index: 15;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 1rem;
}
#puzzle-container.active {
  opacity: 1;
  pointer-events: auto;
}

/* ─── Exploration: Tent ─── */
.explore-tent {
  width: 100%; max-width: 400px;
  display: flex; flex-direction: column;
  align-items: center; gap: 1.5rem;
}
.tent-lanterns {
  font-size: 2rem; letter-spacing: 2rem;
  animation: lantern-glow 2s ease-in-out infinite alternate;
}
@keyframes lantern-glow {
  0% { filter: brightness(0.7); }
  100% { filter: brightness(1.3); }
}
.tent-objects {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1rem; width: 100%;
}
.tent-obj {
  display: flex; flex-direction: column;
  align-items: center; gap: 0.5rem;
  padding: 1rem; border-radius: 12px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
}
.tent-obj::after {
  content: '';
  position: absolute; inset: -2px;
  border-radius: 14px;
  background: radial-gradient(circle, rgba(255,200,100,0.15), transparent 70%);
  animation: obj-glow 2s ease-in-out infinite alternate;
  pointer-events: none;
}
@keyframes obj-glow {
  0% { opacity: 0.3; }
  100% { opacity: 1; }
}
.tent-obj:hover, .tent-obj:active {
  background: rgba(255,255,255,0.15);
  transform: scale(1.05);
}
.tent-obj-emoji { font-size: 2.5rem; }
.tent-obj-label { font-size: 0.8rem; color: rgba(255,255,255,0.7); }
.tent-couple { font-size: 2rem; margin-top: 0.5rem; color: rgba(255,255,255,0.5); }
.tent-bubble {
  background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.15);
  border-radius: 12px; padding: 1rem 1.2rem;
  color: rgba(255,255,255,0.85);
  font-size: 0.9rem; line-height: 1.6;
  min-height: 60px; width: 100%; text-align: center;
  transition: opacity 0.3s;
}

/* ─── Exploration: Date Montage ─── */
.date-montage { width: 100%; max-width: 420px; }
.date-tabs {
  display: flex; gap: 0.5rem;
  margin-bottom: 1rem;
}
.date-tab {
  flex: 1; padding: 0.8rem 0.5rem;
  border-radius: 10px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.8);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.85rem;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s;
}
.date-tab:hover, .date-tab:active { background: rgba(255,255,255,0.15); }
.date-tab.visited { border-color: rgba(160,120,255,0.5); background: rgba(160,120,255,0.1); }
.date-tab.locked { opacity: 0.3; pointer-events: none; }
.date-tab.unlocked { border-color: rgba(255,200,100,0.5); animation: blink 1.5s ease-in-out infinite; }
.date-scene {
  background: rgba(0,0,0,0.6); border-radius: 12px;
  padding: 1.5rem; min-height: 200px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 1rem;
}
.date-emoji { font-size: 3rem; }
.date-dialogue {
  color: rgba(255,255,255,0.85);
  font-size: 0.9rem; line-height: 1.7; text-align: center;
}
.date-visited-count {
  color: rgba(255,255,255,0.4); font-size: 0.75rem;
  margin-top: 0.5rem; text-align: center;
}

/* ─── Puzzle 1: Mirror Dressing ─── */
.mirror-puzzle { width: 100%; max-width: 420px; }
.mirror-chars {
  display: flex; justify-content: center;
  gap: 2rem; margin-bottom: 1rem;
}
.mirror-char {
  display: flex; flex-direction: column;
  align-items: center; gap: 0.3rem;
}
.mirror-char-emoji { font-size: 3rem; }
.mirror-char-label { font-size: 0.75rem; color: rgba(255,255,255,0.5); }
.mirror-bubble {
  background: rgba(0,0,0,0.7);
  border: 1px solid rgba(116,185,255,0.3);
  border-radius: 12px; padding: 0.8rem 1rem;
  color: rgba(255,255,255,0.85);
  font-size: 0.9rem; text-align: center;
  margin-bottom: 1.2rem; min-height: 50px;
  transition: all 0.3s;
}
.mirror-category {
  margin-bottom: 1rem;
}
.mirror-cat-label {
  font-size: 0.8rem; color: rgba(255,255,255,0.5);
  margin-bottom: 0.5rem;
}
.mirror-options {
  display: flex; gap: 0.5rem;
}
.mirror-opt {
  flex: 1; padding: 0.7rem;
  border-radius: 10px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.85);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.85rem; text-align: center;
  cursor: pointer; transition: all 0.3s;
}
.mirror-opt:hover { background: rgba(255,255,255,0.15); }
.mirror-opt.selected {
  border-color: rgba(160,120,255,0.7);
  background: rgba(160,120,255,0.15);
}
.mirror-confirm {
  width: 100%; padding: 1rem;
  margin-top: 1rem;
  border-radius: 10px;
  background: rgba(160,120,255,0.2);
  border: 1px solid rgba(160,120,255,0.4);
  color: #fff;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 1rem; cursor: pointer;
  transition: all 0.3s;
  opacity: 0; pointer-events: none;
}
.mirror-confirm.visible {
  opacity: 1; pointer-events: auto;
}
.mirror-confirm:hover { background: rgba(160,120,255,0.4); }

/* ─── Puzzle 2: Puppy Communication ─── */
.puppy-puzzle { width: 100%; max-width: 420px; }
.puppy-gauge-wrap {
  width: 100%; margin-bottom: 1rem;
}
.puppy-gauge-label {
  font-size: 0.75rem; color: rgba(255,255,255,0.5);
  margin-bottom: 0.3rem; display: flex;
  justify-content: space-between;
}
.puppy-gauge-bar {
  width: 100%; height: 8px;
  background: rgba(255,255,255,0.1);
  border-radius: 4px; overflow: hidden;
}
.puppy-gauge-fill {
  height: 100%; width: 20%;
  background: linear-gradient(90deg, #56ab2f, #a8e063);
  border-radius: 4px;
  transition: width 0.6s ease;
}
.puppy-scene-area {
  background: rgba(0,0,0,0.5);
  border-radius: 12px; padding: 1.5rem;
  min-height: 180px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 1rem; margin-bottom: 1rem;
}
.puppy-scene-emoji { font-size: 3rem; }
.puppy-scene-text {
  color: rgba(255,255,255,0.7);
  font-size: 0.9rem; text-align: center; line-height: 1.6;
}
.puppy-options {
  display: flex; gap: 0.8rem;
  justify-content: center; flex-wrap: wrap;
}
.puppy-opt {
  width: 64px; height: 64px;
  border-radius: 50%;
  background: rgba(255,255,255,0.05);
  border: 2px solid rgba(255,255,255,0.15);
  font-size: 1.8rem;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.3s;
}
.puppy-opt:hover, .puppy-opt:active {
  background: rgba(255,255,255,0.15);
  transform: scale(1.15);
}
.puppy-round-num {
  font-size: 0.75rem; color: rgba(255,255,255,0.3);
  text-align: center; margin-bottom: 0.5rem;
}

/* ─── Puzzle 3: Evidence Board ─── */
.evidence-puzzle { width: 100%; max-width: 440px; }
.evidence-title {
  color: rgba(255,255,255,0.7); font-size: 0.9rem;
  text-align: center; margin-bottom: 1rem;
}
.evidence-board {
  background: linear-gradient(135deg, #5c3d2e, #8b6f47);
  border-radius: 12px; padding: 1rem;
  min-height: 120px; margin-bottom: 1rem;
  border: 3px solid #3d2b1f;
}
.evidence-slots {
  display: flex; gap: 0.5rem; justify-content: center;
}
.evidence-slot {
  width: 100px; height: 70px;
  border: 2px dashed rgba(255,255,255,0.3);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.75rem; color: rgba(255,255,255,0.4);
  cursor: pointer; transition: all 0.3s;
}
.evidence-slot.filled {
  border-style: solid;
  border-color: rgba(255,255,255,0.5);
  background: rgba(0,0,0,0.3);
  font-size: 0.7rem; color: rgba(255,255,255,0.8);
  padding: 0.3rem; text-align: center;
}
.evidence-slot.filled:hover { background: rgba(255,0,0,0.15); }
.evidence-cards {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 0.5rem; margin-bottom: 1rem;
}
.evidence-card {
  padding: 0.6rem 0.4rem;
  background: rgba(255,255,200,0.08);
  border: 1px solid rgba(255,255,200,0.2);
  border-radius: 8px;
  font-size: 0.75rem; color: rgba(255,255,255,0.85);
  text-align: center; cursor: pointer;
  transition: all 0.3s;
}
.evidence-card:hover { background: rgba(255,255,200,0.2); }
.evidence-card.selected {
  border-color: #f0c040;
  background: rgba(240,192,64,0.15);
}
.evidence-card.used { opacity: 0.3; pointer-events: none; }
.evidence-actions { display: flex; gap: 0.5rem; }
.evidence-btn {
  flex: 1; padding: 0.8rem;
  border-radius: 8px;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.9rem; cursor: pointer;
  transition: all 0.3s; border: 1px solid;
}
.evidence-submit {
  background: rgba(64,224,208,0.15);
  border-color: rgba(64,224,208,0.4);
  color: #40e0d0;
}
.evidence-submit:hover { background: rgba(64,224,208,0.3); }
.evidence-submit:disabled { opacity: 0.3; pointer-events: none; }
.evidence-giveup {
  background: rgba(255,100,100,0.1);
  border-color: rgba(255,100,100,0.3);
  color: rgba(255,100,100,0.7);
}
.evidence-giveup:hover { background: rgba(255,100,100,0.2); }
.evidence-result {
  text-align: center; padding: 1rem;
  font-size: 0.9rem; color: rgba(255,255,255,0.8);
  min-height: 40px;
}
.evidence-tries {
  font-size: 0.75rem; color: rgba(255,255,255,0.4);
  text-align: center; margin-bottom: 0.5rem;
}
@keyframes stamp {
  0% { transform: scale(3) rotate(-15deg); opacity: 0; }
  50% { transform: scale(1.1) rotate(-12deg); opacity: 1; }
  100% { transform: scale(1) rotate(-12deg); opacity: 1; }
}
.evidence-stamp {
  color: #ff3333; font-size: 2rem; font-weight: 700;
  border: 4px solid #ff3333; padding: 0.3rem 1rem;
  display: inline-block; transform: rotate(-12deg);
  animation: stamp 0.4s ease-out;
  margin-top: 0.5rem;
}

/* ─── Puzzle 4: Confrontation ─── */
.confront-puzzle {
  width: 100%; max-width: 400px;
  display: flex; flex-direction: column;
  align-items: center; gap: 1rem;
}
.confront-timer-wrap {
  position: relative;
  width: 140px; height: 140px;
}
.confront-timer-ring {
  width: 100%; height: 100%;
  border-radius: 50%;
  background: conic-gradient(
    #ff4444 var(--angle, 360deg),
    rgba(255,255,255,0.1) var(--angle, 360deg)
  );
  display: flex; align-items: center; justify-content: center;
  transition: background 0.1s;
}
.confront-face {
  width: 110px; height: 110px;
  border-radius: 50%;
  background: rgba(0,0,0,0.8);
  display: flex; align-items: center; justify-content: center;
  font-size: 3.5rem;
}
.confront-dialogue {
  color: rgba(255,255,255,0.9);
  font-size: 1.1rem; text-align: center;
  line-height: 1.6; min-height: 50px;
  padding: 0 1rem;
}
.confront-options {
  display: flex; gap: 0.8rem;
  justify-content: center; flex-wrap: wrap;
}
.confront-btn {
  padding: 0.8rem 1.2rem;
  border-radius: 10px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.2);
  cursor: pointer; transition: all 0.3s;
  font-size: 1.5rem;
  display: flex; align-items: center; gap: 0.5rem;
}
.confront-btn:hover { background: rgba(255,255,255,0.15); transform: scale(1.05); }
.confront-btn-label {
  font-size: 0.8rem; color: rgba(255,255,255,0.7);
}
.confront-round-info {
  font-size: 0.75rem; color: rgba(255,255,255,0.3);
}

/* ─── Puzzle 5: Result Dashboard ─── */
.result-puzzle {
  width: 100%; max-width: 420px;
  display: flex; flex-direction: column;
  align-items: center; gap: 1.2rem;
}
.result-score-big {
  font-size: 5rem; font-weight: 700;
  color: #fff;
  text-shadow: 0 0 40px rgba(255,200,50,0.5);
}
.result-score-percent {
  font-size: 1.8rem; color: rgba(255,255,255,0.7);
  margin-top: -1rem;
}
.result-avg-text {
  font-size: 0.85rem; color: rgba(255,255,255,0.5);
  text-align: center;
}
.result-detail-btn {
  padding: 0.8rem 2rem;
  border-radius: 10px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.3);
  color: #fff;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.95rem; cursor: pointer;
  transition: all 0.3s;
}
.result-detail-btn:hover { background: rgba(255,255,255,0.2); }
.result-categories {
  width: 100%;
  display: flex; flex-direction: column; gap: 0.8rem;
}
.result-cat {
  padding: 1rem;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  cursor: pointer; transition: all 0.3s;
}
.result-cat:hover { background: rgba(255,255,255,0.1); }
.result-cat.revealed { cursor: default; }
.result-cat-header {
  display: flex; justify-content: space-between;
  align-items: center; margin-bottom: 0.5rem;
}
.result-cat-name {
  font-size: 0.9rem; color: rgba(255,255,255,0.85);
}
.result-cat-score {
  font-size: 0.9rem; font-weight: 700; color: #f0c040;
  opacity: 0; transition: opacity 0.5s;
}
.result-cat.revealed .result-cat-score { opacity: 1; }
.result-cat-bar {
  width: 100%; height: 6px;
  background: rgba(255,255,255,0.1);
  border-radius: 3px; overflow: hidden;
}
.result-cat-fill {
  height: 100%; width: 0%;
  border-radius: 3px;
  transition: width 1s ease;
}
.result-summary {
  font-size: 1.1rem; color: #fff;
  text-align: center; padding: 0.5rem;
  opacity: 0; transition: opacity 0.5s;
}
.result-summary.visible { opacity: 1; }
.result-exit {
  padding: 0.8rem 2rem;
  border-radius: 10px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.3);
  color: #fff;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.95rem; cursor: pointer;
  transition: all 0.3s;
  opacity: 0; pointer-events: none;
}
.result-exit.visible {
  opacity: 1; pointer-events: auto;
}
.result-exit:hover { background: rgba(255,255,255,0.2); }

/* ─── Confetti ─── */
.confetti {
  position: fixed;
  width: 10px; height: 10px; opacity: 0;
  z-index: 200; pointer-events: none;
}
@keyframes confetti-fall {
  0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

/* ─── Scene CG (image placeholder) ─── */
#scene-cg {
  position: absolute;
  top: 8%;
  left: 50%;
  transform: translateX(-50%);
  width: 260px; height: 180px;
  border-radius: 14px;
  background: rgba(0,0,0,0.35);
  border: 2px dashed rgba(255,255,255,0.12);
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 3.5rem;
  z-index: 2;
  opacity: 0;
  transition: opacity 0.6s ease;
}
#scene-cg.active { display: flex; }
#scene-cg.visible { opacity: 1; }
#scene-cg::after {
  content: 'img';
  position: absolute;
  bottom: 6px; right: 10px;
  font-size: 0.55rem;
  color: rgba(255,255,255,0.15);
  letter-spacing: 0.1em;
}

/* ─── Dialogue Portrait ─── */
#dialogue-top {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.6rem 1.2rem 0;
}
#portrait {
  width: 44px; height: 44px;
  border-radius: 10px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.12);
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  flex-shrink: 0;
  position: relative;
}
#portrait.active { display: flex; }
#portrait::after {
  content: 'img';
  position: absolute;
  bottom: 1px; right: 3px;
  font-size: 0.4rem;
  color: rgba(255,255,255,0.15);
}

/* ─── Explore Header Image ─── */
.explore-header-img {
  width: 220px; height: 150px;
  border-radius: 14px;
  background: rgba(0,0,0,0.3);
  border: 2px dashed rgba(255,255,255,0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 3rem;
  margin-bottom: 1rem;
  flex-shrink: 0;
  position: relative;
}
.explore-header-img::after {
  content: 'img';
  position: absolute;
  bottom: 6px; right: 10px;
  font-size: 0.55rem;
  color: rgba(255,255,255,0.15);
  letter-spacing: 0.1em;
}

/* ─── Responsive ─── */
@media (max-width: 600px) {
  #dialogue-box { height: 40%; }
  #text-area { font-size: 0.9rem; }
  #scene-desc-text { font-size: 0.95rem; }
  .mirror-options { gap: 0.3rem; }
  .mirror-opt { font-size: 0.8rem; padding: 0.5rem; }
  .evidence-cards { grid-template-columns: repeat(2, 1fr); }
  .evidence-slot { width: 80px; height: 60px; }
  .confront-timer-wrap { width: 120px; height: 120px; }
  .confront-face { width: 94px; height: 94px; font-size: 2.8rem; }
  .result-score-big { font-size: 4rem; }
  #scene-cg { width: 200px; height: 140px; font-size: 2.8rem; top: 5%; }
  .explore-header-img { width: 180px; height: 120px; font-size: 2.5rem; }
  #portrait { width: 38px; height: 38px; font-size: 1.2rem; }
}
</style>
</head>
<body>
<div id="game">
  <div id="bg"></div>
  <div id="scene-desc"><div id="scene-desc-text"></div></div>
  <div id="scene-cg"></div>
  <div id="puzzle-container"></div>
  <div id="dialogue-box">
    <div id="dialogue-top">
      <div id="portrait"></div>
      <div id="speaker"></div>
    </div>
    <div id="text-area"></div>
    <div id="continue-indicator">클릭하여 계속 ▼</div>
  </div>
  <div id="choices"></div>
  <div id="fade"></div>
  <div id="flash"></div>
  <div id="title-screen">
    <h1>커플 궁합 테스트</h1>
    <div class="subtitle">쯔꾸르 스타일 스토리 게임</div>
    <div class="start-text">화면을 터치하여 시작</div>
  </div>
</div>

<script>
// ═══════════════════════════════════════
//  DOM REFERENCES
// ═══════════════════════════════════════
const $ = id => document.getElementById(id);
const bg = $('bg');
const speakerEl = $('speaker');
const textArea = $('text-area');
const continueInd = $('continue-indicator');
const choicesEl = $('choices');
const fade = $('fade');
const flash = $('flash');
const titleScreen = $('title-screen');
const sceneDesc = $('scene-desc');
const sceneDescText = $('scene-desc-text');
const puzzleContainer = $('puzzle-container');
const dialogueBox = $('dialogue-box');
const sceneCg = $('scene-cg');
const portraitEl = $('portrait');
const game = $('game');

// ═══════════════════════════════════════
//  ENGINE STATE
// ═══════════════════════════════════════
let currentLine = 0;
let typing = false;
let typingTimer = null;
let fullText = '';
let canAdvance = false;
let waitingForChoice = false;
let waitingForPuzzle = false;
let gameStarted = false;
let currentPortraits = { heroine: '👩', hero: '🧑', system: '🖥️' };

const NARRATOR = 'narrator';
const HEROINE = 'heroine';
const HERO = 'hero';
const SYSTEM = 'system';

function speakerName(type) {
  switch(type) {
    case HEROINE: return '나';
    case HERO: return '남자친구';
    case SYSTEM: return 'SYSTEM';
    default: return '';
  }
}

// ═══════════════════════════════════════
//  UTILITY FUNCTIONS
// ═══════════════════════════════════════
function typeText(text, callback) {
  textArea.textContent = '';
  fullText = text;
  typing = true;
  canAdvance = false;
  continueInd.style.visibility = 'hidden';
  let i = 0;
  const speed = 35;
  function typeChar() {
    if (i < text.length) {
      textArea.textContent += text[i];
      i++;
      typingTimer = setTimeout(typeChar, speed);
    } else {
      typing = false;
      canAdvance = true;
      continueInd.style.visibility = 'visible';
      if (callback) callback();
    }
  }
  typeChar();
}

function skipTyping() {
  if (typing) {
    clearTimeout(typingTimer);
    textArea.textContent = fullText;
    typing = false;
    canAdvance = true;
    continueInd.style.visibility = 'visible';
  }
}

function setBg(gradient) { bg.style.background = gradient; }

function setSceneDesc(text) {
  if (text) {
    sceneDescText.textContent = text;
    sceneDesc.classList.add('visible');
  } else {
    sceneDesc.classList.remove('visible');
  }
}

function doFade(callback) {
  fade.classList.remove('hidden');
  setTimeout(() => {
    if (callback) callback();
    setTimeout(() => fade.classList.add('hidden'), 200);
  }, 800);
}

function doShake() {
  game.classList.add('shake');
  setTimeout(() => game.classList.remove('shake'), 600);
}

function doFlash() {
  flash.classList.add('active');
  setTimeout(() => flash.classList.remove('active'), 500);
}

function showCg(emoji) {
  sceneCg.textContent = emoji;
  sceneCg.classList.add('active');
  requestAnimationFrame(() => sceneCg.classList.add('visible'));
}

function hideCg() {
  sceneCg.classList.remove('visible');
  setTimeout(() => { sceneCg.classList.remove('active'); sceneCg.textContent = ''; }, 600);
}

function showPortrait(type) {
  if (type === NARRATOR || !type) {
    portraitEl.classList.remove('active');
    portraitEl.textContent = '';
    return;
  }
  const emoji = currentPortraits[type] || '';
  if (emoji) {
    portraitEl.textContent = emoji;
    portraitEl.classList.add('active');
  } else {
    portraitEl.classList.remove('active');
  }
}

function createConfetti() {
  const colors = ['#ff6b6b','#feca57','#48dbfb','#ff9ff3','#54a0ff','#5f27cd','#01a3a4','#f368e0'];
  for (let i = 0; i < 50; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + '%';
    c.style.top = '-20px';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.width = (Math.random() * 8 + 5) + 'px';
    c.style.height = (Math.random() * 8 + 5) + 'px';
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
    c.style.animation = `confetti-fall ${Math.random()*2+2}s linear ${Math.random()*0.5}s forwards`;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4500);
  }
}

function showChoices(options) {
  waitingForChoice = true;
  choicesEl.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = opt.text;
    btn.addEventListener('click', e => {
      e.stopPropagation();
      waitingForChoice = false;
      choicesEl.classList.remove('active');
      currentLine++;
      processLine();
    });
    choicesEl.appendChild(btn);
  });
  choicesEl.classList.add('active');
  continueInd.style.visibility = 'hidden';
}

// ═══════════════════════════════════════
//  MODE SWITCHING
// ═══════════════════════════════════════
function enterInteractiveMode(callback) {
  waitingForPuzzle = true;
  canAdvance = false;
  continueInd.style.visibility = 'hidden';
  dialogueBox.classList.add('slide-down');
  sceneDesc.classList.remove('visible');
  setTimeout(() => {
    puzzleContainer.classList.add('active');
    callback();
  }, 600);
}

function exitInteractiveMode() {
  puzzleContainer.classList.remove('active');
  setTimeout(() => {
    puzzleContainer.innerHTML = '';
    dialogueBox.classList.remove('slide-down');
    waitingForPuzzle = false;
    currentLine++;
    setTimeout(() => processLine(), 400);
  }, 500);
}

// ═══════════════════════════════════════
//  EXPLORATION MODULES
// ═══════════════════════════════════════
const explorations = {

  tent_interior(container, onComplete) {
    const wrap = document.createElement('div');

    const hdr = document.createElement('div');
    hdr.className = 'explore-header-img';
    hdr.textContent = '🏮🖥️🪑';
    wrap.appendChild(hdr);

    const bubble = document.createElement('div');
    bubble.className = 'tent-bubble';

    const objects = [

      { emoji: '📋', label: '설명서', msg: '체험자의 데이터로 시뮬레이션을 돌린다고 적혀있다.\n"가상현실 속 1일은 현실의 0.001초"' },
      { emoji: '🪑', label: '앉기', action: true, msg: '의자에 앉아 장비를 착용하기로 했다.' },
    ];

    const grid = document.createElement('div');
    grid.className = 'tent-objects';
    objects.forEach(obj => {
      const el = document.createElement('div');
      el.className = 'tent-obj';
      el.innerHTML = `<div class="tent-obj-emoji">${obj.emoji}</div><div class="tent-obj-label">${obj.label}</div>`;
      el.addEventListener('click', () => {
        bubble.textContent = obj.msg;
        if (obj.action) {
          setTimeout(() => onComplete(), 800);
        }
      });
      grid.appendChild(el);
    });
    wrap.appendChild(grid);

    const couple = document.createElement('div');
    couple.className = 'tent-couple';
    couple.textContent = '👫';
    wrap.appendChild(couple);

    wrap.appendChild(bubble);
    container.appendChild(wrap);
  },

  date_montage(container, onComplete) {
    const wrap = document.createElement('div');
    wrap.className = 'date-montage';
    const hdr = document.createElement('div');
    hdr.className = 'explore-header-img';
    hdr.textContent = '💑🌆';
    hdr.style.margin = '0 auto 1rem';
    wrap.appendChild(hdr);

    const locations = [
      { emoji: '☕', label: '카페', scene: '☕🧁', dialogue: '"이 몸으로 카페라니, 신기하다."\n"너 의외로 아메리카노 잘 어울린다?"' },
      { emoji: '🌳', label: '공원', scene: '🌳🐦', dialogue: '"바람이 좋다... 좀 적응된 것 같아."\n"그치? 나도 이제 좀 편해."' },
      { emoji: '🎬', label: '영화관', scene: '🎬🍿', dialogue: '"팔걸이가 좀 좁아졌는데?"\n"하하, 덩치가 바뀌었으니까!"' },
      { emoji: '🌙', label: '집으로', scene: '🌙🏠', dialogue: null, action: true },
    ];

    let visited = new Set();

    const tabs = document.createElement('div');
    tabs.className = 'date-tabs';

    const sceneArea = document.createElement('div');
    sceneArea.className = 'date-scene';
    sceneArea.innerHTML = '<div class="date-emoji">💜</div><div class="date-dialogue">장소를 선택해서 데이트를 즐기자!</div>';

    const countEl = document.createElement('div');
    countEl.className = 'date-visited-count';
    countEl.textContent = '방문한 장소: 0 / 3';

    function updateTabs() {
      tabs.querySelectorAll('.date-tab').forEach((tab, i) => {
        const loc = locations[i];
        tab.classList.toggle('visited', visited.has(i));
        if (loc.action) {
          if (visited.size >= 3) {
            tab.classList.remove('locked');
            tab.classList.add('unlocked');
          } else {
            tab.classList.add('locked');
            tab.classList.remove('unlocked');
          }
        }
      });
      countEl.textContent = `방문한 장소: ${Math.min(visited.size, 3)} / 3`;
    }

    locations.forEach((loc, i) => {
      const tab = document.createElement('button');
      tab.className = 'date-tab';
      if (loc.action) tab.classList.add('locked');
      tab.textContent = `${loc.emoji} ${loc.label}`;
      tab.addEventListener('click', () => {
        if (loc.action) {
          if (visited.size >= 3) {
            sceneArea.innerHTML = `<div class="date-emoji">${loc.scene}</div><div class="date-dialogue">밤이 깊어간다... 집으로 돌아가기로 했다.</div>`;
            setTimeout(() => onComplete(), 1200);
          }
          return;
        }
        visited.add(i);
        sceneArea.innerHTML = `<div class="date-emoji">${loc.scene}</div><div class="date-dialogue">${loc.dialogue}</div>`;
        updateTabs();
      });
      tabs.appendChild(tab);
    });

    wrap.appendChild(tabs);
    wrap.appendChild(sceneArea);
    wrap.appendChild(countEl);
    container.appendChild(wrap);
    updateTabs();
  },

  // ─── Festival Street ───
  festival_street(container, onComplete) {
    const wrap = document.createElement('div');

    const bubble = document.createElement('div');

  // ─── Puppy House ───
  puppy_house(container, onComplete) {

      { emoji: '🛋️', label: '소파 밑', msg: '어둡고 먼지가 있다.\n이상하게 안전한 느낌이 든다.' },

  prison_visit(container, onComplete) {

      { text: '(팔을 잡는다)', emoji: '😡', time: 2000,
        options: [{e:'✋',l:'밀친다'}], shk: true },
    ];

    const bgColors = [
      'linear-gradient(135deg, #2d3436 0%, #4a1a1a 100%)',
      'linear-gradient(135deg, #3a1515 0%, #5a1a1a 100%)',
      'linear-gradient(135deg, #4a0a0a 0%, #6a0a0a 100%)',
      'linear-gradient(135deg, #5a0000 0%, #7a0000 100%)',
      'linear-gradient(135deg, #6a0000 0%, #000000 100%)',
    ];

    let currentRound = 0;
    let animFrame = null;

    function renderRound() {
      const r = rounds[currentRound];
      wrap.innerHTML = '';
      bg.style.background = bgColors[currentRound];

      if (r.shk) doShake();

      // Round info
      const info = document.createElement('div');
      info.className = 'confront-round-info';
      info.textContent = `${currentRound + 1} / ${rounds.length}`;
      wrap.appendChild(info);

      // Timer ring + face
      const timerWrap = document.createElement('div');
      timerWrap.className = 'confront-timer-wrap';
      const ring = document.createElement('div');
      ring.className = 'confront-timer-ring';
      ring.style.setProperty('--angle', '360deg');
      const face = document.createElement('div');
      face.className = 'confront-face';
      face.textContent = r.emoji;
      ring.appendChild(face);
      timerWrap.appendChild(ring);
      wrap.appendChild(timerWrap);

      // Dialogue
      const dlg = document.createElement('div');
      dlg.className = 'confront-dialogue';
      dlg.textContent = r.text;
      wrap.appendChild(dlg);

      // Options
      const optsWrap = document.createElement('div');
      optsWrap.className = 'confront-options';
      r.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'confront-btn';
        btn.innerHTML = `<span>${opt.e}</span><span class="confront-btn-label">${opt.l}</span>`;
        btn.addEventListener('click', () => selectOption());
        optsWrap.appendChild(btn);
      });
      wrap.appendChild(optsWrap);

      // Timer
      const startTime = Date.now();
      let done = false;
      function tick() {
        if (done) return;
        const elapsed = Date.now() - startTime;
        const remaining = Math.max(0, 1 - elapsed / r.time);
        ring.style.setProperty('--angle', `${remaining * 360}deg`);
        if (remaining <= 0) {
          done = true;
          selectOption();
          return;
        }
        animFrame = requestAnimationFrame(tick);
      }
      animFrame = requestAnimationFrame(tick);

      function selectOption() {
        if (done && animFrame) return;
        done = true;
        cancelAnimationFrame(animFrame);
        currentRound++;
        if (currentRound >= rounds.length) {
          wrap.innerHTML = '';
          setTimeout(() => onComplete(), 300);
        } else {
          setTimeout(() => renderRound(), 600);
        }
      }
    }

    container.appendChild(wrap);
    renderRound();
  },

    countUp();

    detailBtn.addEventListener('click', () => {
      detailBtn.style.display = 'none';
      catsWrap.style.display = 'flex';
    });

  { type: NARRATOR, text: '화면에는 65라는 숫자가 떠있고,\n배경에 빵빠레와 축포 그림이 계속해서 터지고 있었다.' },
  { type: NARRATOR, text: '그 발랄한 축하 연출이\n어째서인지 잔인하게 느껴졌다.' },
  { type: NARRATOR, text: '서로를 잠시 바라보았다.' },
  { type: NARRATOR, text: '아무 말도 나오지 않았다.' },
  { choice: true, options: [
    { text: '"...나가자."' },
    { text: '(아무 말 없이 짐을 챙긴다)' },
  ]},
  { type: NARRATOR, text: '내가 먼저 짐을 챙겨서 천막을 나섰다.' },
  { bg: 'linear-gradient(135deg, #2c3e50 0%, #34495e 50%, #4a6741 100%)' },
  { type: NARRATOR, text: '남자친구는 멍한 얼굴로\n기계에서 나오는 발랄한 축하 음악을 듣다가—' },
  { type: NARRATOR, text: '내가 간 길을 따라 나섰다.' },
  { bg: 'linear-gradient(135deg, #2c3e50 0%, #1a1a2e 100%)' },
  { type: NARRATOR, text: '축제의 불빛이 저 멀리서 반짝였다.' },
  { type: NARRATOR, text: '둘은 아주 오랫동안\n한 마디 말도 하지 않았다.' },
  { type: NARRATOR, text: '......' },
  { type: NARRATOR, text: '\n\n— 끝 —' },
  { end: true },
];

// ═══════════════════════════════════════
//  MAIN GAME LOOP
// ═══════════════════════════════════════
function processLine() {
  if (currentLine >= scenes.length) return;
  const line = scenes[currentLine];

  // End
  if (line.end) { showEnding(); return; }

  // Portrait change
  if (line.portraits) {
    currentPortraits = { ...currentPortraits, ...line.portraits };
    currentLine++;
    processLine();
    return;
  }

  // CG display
  if (line.cg !== undefined && !line.type && !line.bg) {
    if (line.cg) showCg(line.cg); else hideCg();
    currentLine++;
    processLine();
    return;
  }

  // Puzzle
  if (line.puzzle) {
    enterInteractiveMode(() => {
      puzzles[line.puzzle](puzzleContainer, () => exitInteractiveMode());
    });
    return;
  }

  // Exploration
  if (line.explore) {
    enterInteractiveMode(() => {
      explorations[line.explore](puzzleContainer, () => exitInteractiveMode());
    });
    return;
  }

  // Background change
  if (line.bg) {
    const hasFade = line.fade;
    const hasShake = line.shake;
    const desc = line.desc;

    if (hasFade) {
      canAdvance = false;
      doFade(() => {
        setBg(line.bg);
        if (desc !== undefined) setSceneDesc(desc);
      });
      if (!line.type && !line.choice) {
        currentLine++;
        setTimeout(() => processLine(), 1200);
        return;
      } else {
        setTimeout(() => showDialogue(line), 1200);
        return;
      }
    }

    if (hasShake) {
      setBg(line.bg);
      if (desc !== undefined) setSceneDesc(desc);
      doShake();
      if (!line.type && !line.choice) {
        currentLine++;
        setTimeout(() => processLine(), 400);
        return;
      }
    }

    if (!hasFade && !hasShake) {
      setBg(line.bg);
      if (desc !== undefined) setSceneDesc(desc);
      if (!line.type && !line.choice) {
        currentLine++;
        processLine();
        return;
      }
    }
  }

  // Choice
  if (line.choice) { showChoices(line.options); return; }

  // Dialogue
  if (line.type) { showDialogue(line); return; }

  // Fallback
  currentLine++;
  processLine();
}

function showDialogue(line) {
  speakerEl.textContent = speakerName(line.type);
  speakerEl.className = line.type || '';
  showPortrait(line.type);
  if (line.shake) doShake();
  typeText(line.text);
}

function advance() {
  if (waitingForChoice || waitingForPuzzle) return;
  if (typing) { skipTyping(); return; }
  if (!canAdvance) return;
  canAdvance = false;
  currentLine++;
  processLine();
}

function showEnding() {
  textArea.textContent = '';
  speakerEl.textContent = '';
  speakerEl.className = '';
  continueInd.style.visibility = 'hidden';
  bg.style.background = 'linear-gradient(135deg, #1a1a2e 0%, #16213e 100%)';
  sceneDesc.classList.remove('visible');
  setTimeout(() => {
    textArea.innerHTML = '<div style="text-align:center; margin-top:2rem; color:rgba(255,255,255,0.4);">화면을 클릭하면 처음부터 다시 시작합니다.</div>';
    canAdvance = false;
    const restartHandler = () => {
      document.removeEventListener('click', restartHandler);
      currentLine = 0;
      startGame();
    };
    setTimeout(() => document.addEventListener('click', restartHandler), 1000);
  }, 2000);
}

// ═══════════════════════════════════════
//  EVENT LISTENERS
// ═══════════════════════════════════════
document.addEventListener('click', e => {
  if (!gameStarted) return;
  if (waitingForChoice || waitingForPuzzle) return;
  advance();
});

document.addEventListener('keydown', e => {
  if (!gameStarted) return;
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    if (waitingForChoice || waitingForPuzzle) return;
    advance();
  }
});

// ═══════════════════════════════════════
//  START
// ═══════════════════════════════════════
function startGame() {
  gameStarted = false;
  puzzleContainer.classList.remove('active');
  puzzleContainer.innerHTML = '';
  dialogueBox.classList.remove('slide-down');
  sceneDesc.classList.remove('visible');
  titleScreen.style.display = 'flex';
  fade.classList.add('hidden');
  currentLine = 0;
  typing = false;
  canAdvance = false;
  waitingForChoice = false;
  waitingForPuzzle = false;
  textArea.textContent = '';
  speakerEl.textContent = '';
  speakerEl.className = '';
  bg.style.background = '#1a1a2e';
  continueInd.style.visibility = 'hidden';
  hideCg();
  portraitEl.classList.remove('active');
  portraitEl.textContent = '';
  currentPortraits = { heroine: '👩', hero: '🧑', system: '🖥️' };

  const startHandler = () => {
    titleScreen.removeEventListener('click', startHandler);
    titleScreen.style.display = 'none';
    gameStarted = true;
    fade.classList.remove('hidden');
    setTimeout(() => {
      processLine();
      setTimeout(() => fade.classList.add('hidden'), 200);
    }, 500);
  };
  titleScreen.addEventListener('click', startHandler);
}

startGame();
</script>
